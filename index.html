<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>忍者走行テスト11</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#222}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
#ninja{position:absolute;left:50%;top:62%;width:34vw;max-width:250px;min-width:90px;height:auto;
transform:translate(-50%,-50%);transform-origin:50% 50%;pointer-events:none;user-select:none;-webkit-user-drag:none}
#analyze{display:none}
#status{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:10;
padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.60);font-size:13px;line-height:1.45;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#panel{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:10;
padding:10px;border-radius:14px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.row{display:grid;grid-template-columns:90px 1fr 58px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
input[type=range]{width:100%}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-top:8px}
button{appearance:none;border:0;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:700;background:#fff;color:#111}
button.secondary{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.25)}
button.active{background:#1f8cff;color:#fff}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.15);margin-left:4px}
</style>
</head>
<body>
<div id="stage">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="analyze" width="64" height="36"></canvas>
  <img id="ninja" alt="running ninja">
  <div id="status">「カメラ開始」を押してください。最初は自動検出ONです。</div>

  <div id="panel">
    <div class="row">
      <span>走る速さ</span>
      <input id="speed" type="range" min="45" max="180" value="85" step="5">
      <span id="speedVal">85ms</span>
    </div>
    <div class="row">
      <span>忍者サイズ</span>
      <input id="size" type="range" min="18" max="60" value="34" step="1">
      <span id="sizeVal">34%</span>
    </div>
    <div class="row">
      <span>高さ</span>
      <input id="heightPos" type="range" min="30" max="85" value="62" step="1">
      <span id="heightVal">62%</span>
    </div>
    <div class="row">
      <span>検出感度</span>
      <input id="sensitivity" type="range" min="1" max="10" value="5" step="1">
      <span id="sensVal">5</span>
    </div>
    <div class="buttons">
      <button id="startCam">カメラ開始</button>
      <button id="autoBtn" class="active">自動 ON</button>
      <button id="flip" class="secondary">手動反転</button>
      <button id="jumpTest" class="secondary">ジャンプテスト</button>
    </div>
  </div>
</div>

  async function startCamera() {
    try {
      status.textContent =
        '診断中… ' +
        'mediaDevices=' + (!!navigator.mediaDevices) +
        ' / getUserMedia=' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) +
        ' / secureContext=' + window.isSecureContext +
        ' / topWindow=' + (window.top === window.self);

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const err = new Error('このブラウザ/表示環境では getUserMedia が使えません');
        err.name = 'MediaDevicesUnavailable';
        throw err;
      }
      if (stream) stream.getTracks().forEach(t => t.stop());

      stream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });
      video.srcObject = stream;
      await video.play();
      prevGray = null;
      flowEMA = 0;
      confidenceEMA = 0;
      lastMotionMag = 0;
      status.textContent = 'カメラ表示中。単独HTMLとして動作中。景色の横方向の流れを検出しています。';
      startCam.textContent = 'カメラ再開';
      requestAnimationFrame(analyzeLoop);
    } catch(e) {
      console.error(e);

      const info = [
        'カメラ開始失敗',
        'name=' + (e && e.name ? e.name : '不明'),
        'message=' + (e && e.message ? e.message : '不明'),
        'mediaDevices=' + (!!navigator.mediaDevices),
        'getUserMedia=' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)),
        'secureContext=' + window.isSecureContext,
        'topWindow=' + (window.top === window.self)
      ].join(' / ');

      status.textContent = info;
    }
  }

  function getGrayFrame() {
    const w = canvas.width, h = canvas.height;
    ctx.drawImage(video, 0, 0, w, h);
    const data = ctx.getImageData(0,0,w,h).data;
    const g = new Uint8Array(w*h);
    // grayscale; skip top/bottom edge by still storing all pixels
    for (let i=0,j=0; i<data.length; i+=4,j++) {
      g[j] = (data[i]*3 + data[i+1]*6 + data[i+2]) / 10;
    }
    return g;
  }

  function estimateShiftRegion(prev, curr, rx0, rx1, ry0, ry1) {
    const w = canvas.width;
    const maxShift = 6;
    let bestShift = 0;
    let bestScore = Infinity;
    let secondScore = Infinity;

    for (let s=-maxShift; s<=maxShift; s++) {
      let sum = 0, count = 0;
      const x0 = Math.max(rx0, rx0 - s);
      const x1 = Math.min(rx1, rx1 - s);

      for (let y=ry0; y<ry1; y+=2) {
        const row = y*w;
        for (let x=x0; x<x1; x+=2) {
          const a = prev[row+x];
          const b = curr[row+x+s];
          sum += Math.abs(a-b);
          count++;
        }
      }

      const score = sum / Math.max(1,count);
      if (score < bestScore) {
        secondScore = bestScore;
        bestScore = score;
        bestShift = s;
      } else if (score < secondScore) {
        secondScore = score;
      }
    }

    return {
      shift: bestShift,
      confidence: Math.max(0, secondScore - bestScore)
    };
  }

  function estimateNearHorizontalShift(prev, curr) {
    const w = canvas.width, h = canvas.height;

    // 画面を3列×2段の6ブロックに分ける。
    // 遠景より大きく動くブロックを「近景候補」として優先する。
    const marginX = 4, marginY = 4;
    const innerW = w - marginX*2;
    const innerH = h - marginY*2;
    const blockW = Math.floor(innerW / 3);
    const blockH = Math.floor(innerH / 2);
    const results = [];

    for (let by=0; by<2; by++) {
      for (let bx=0; bx<3; bx++) {
        const x0 = marginX + bx*blockW;
        const x1 = (bx === 2) ? w-marginX : x0+blockW;
        const y0 = marginY + by*blockH;
        const y1 = (by === 1) ? h-marginY : y0+blockH;
        const r = estimateShiftRegion(prev, curr, x0, x1, y0, y1);

        // 動き量を強めに評価。confidenceは誤判定抑制用。
        const nearScore = Math.abs(r.shift) * (0.45 + Math.min(2.0, r.confidence));
        results.push({...r, nearScore});
      }
    }

    // 大きく動いている近景候補から上位3ブロックを見る。
    results.sort((a,b) => b.nearScore - a.nearScore);
    const top = results.slice(0,3);

    // 上位候補の多数派方向を決める。
    let vote = 0;
    for (const r of top) {
      vote += Math.sign(r.shift) * Math.max(0.25, r.nearScore);
    }
    const dominantSign = vote === 0 ? Math.sign(top[0]?.shift || 0) : Math.sign(vote);

    // 多数派方向だけで重み付き平均。
    let weighted = 0, weightSum = 0, confSum = 0;
    for (const r of top) {
      if (r.shift === 0 || Math.sign(r.shift) === dominantSign) {
        const weight = Math.max(0.25, r.nearScore);
        weighted += r.shift * weight;
        weightSum += weight;
        confSum += r.confidence;
      }
    }

    if (weightSum <= 0) {
      return {shift:0, confidence:0};
    }

    return {
      shift: weighted / weightSum,
      confidence: confSum / Math.max(1, top.length)
    };
  }

  function startJump(reason='manual') {
    const now = performance.now();
    if (isJumping) return false;
    if (reason === 'auto' && now - lastJumpAt < JUMP_COOLDOWN_MS) return false;

    isJumping = true;
    jumpFrameIndex = 0;
    jumpFrameStarted = now;
    jumpYOffsetVh = JUMP_Y_VH[0];
    lastJumpAt = now;
    ninja.src = JUMP_FRAMES[0];
    updateUI();

    status.innerHTML =
      'アクション：<span class="badge">ジャンプ</span>' +
      (reason === 'auto' ? '　近景の急変を検出' : '　手動テスト');
    return true;
  }

  function updateJump(now) {
    if (!isJumping) return;

    if (now - jumpFrameStarted >= JUMP_DURATIONS[jumpFrameIndex]) {
      jumpFrameIndex++;
      jumpFrameStarted = now;

      if (jumpFrameIndex >= JUMP_FRAMES.length) {
        isJumping = false;
        jumpFrameIndex = 0;
        jumpYOffsetVh = 0;
        updateUI();
        return;
      }

      jumpYOffsetVh = JUMP_Y_VH[jumpFrameIndex];
      ninja.src = JUMP_FRAMES[jumpFrameIndex];
      updateUI();
    }
  }

  function applyAuto(flow, confidence) {
    if (!autoMode) return;

    const sens = Number(sensitivity.value);
    const threshold = 0.05 + (10-sens)*0.025;

    // flowの符号に対する忍者の向きを09版で反転修正。
    // 実機テストで確認した見た目のスクロール方向に合わせています。
    if (Math.abs(flow) > threshold && confidence > 0.015) {
      const ninjaDir = flow > 0 ? 1 : -1;
      lastDirection = ninjaDir;
      flipped = (ninjaDir < 0);
    }

    // Map motion magnitude to animation speed.
    const mag = Math.min(6, Math.abs(flow));

    // 近景の流れ量が急に増えたときだけジャンプ候補にする。
    // 単なる一定スクロールでは連続ジャンプしないよう、増分＋クールダウンで判定。
    const motionSurge = mag - lastMotionMag;
    if (autoMode && !isJumping &&
        mag > 1.15 &&
        motionSurge > 0.48 &&
        confidence > 0.018) {
      startJump('auto');
    }
    lastMotionMag = lastMotionMag * 0.55 + mag * 0.45;

    const newMs = Math.round(135 - mag * 13);
    const clamped = Math.max(52, Math.min(135, newMs));
    speed.value = String(clamped);

    const dirText = lastDirection > 0 ? '右向き' : '左向き';
    const motionText = mag < 0.35 ? 'ほぼ停止' :
                       mag < 1.2 ? 'ゆっくり' :
                       mag < 2.8 ? '中速' : '高速';

    status.innerHTML =
      '自動検出：<span class="badge">' + dirText + '</span>' +
      '<span class="badge">' + motionText + '</span>' +
      '　流れ量 ' + flow.toFixed(2) + '　近景優先';

    updateUI();
  }

  function analyzeLoop(ts) {
    if (!stream || video.readyState < 2) {
      requestAnimationFrame(analyzeLoop);
      return;
    }

    if (ts - lastAnalyze >= 150) {
      lastAnalyze = ts;
      const gray = getGrayFrame();
      if (prevGray) {
        const r = estimateNearHorizontalShift(prevGray, gray);
        flowEMA = flowEMA*0.68 + r.shift*0.32;
        confidenceEMA = confidenceEMA*0.7 + r.confidence*0.3;
        applyAuto(flowEMA, confidenceEMA);
      }
      prevGray = gray;
    }
    requestAnimationFrame(analyzeLoop);
  }

  speed.addEventListener('input', () => {
    if (!autoMode) runAnimation();
    updateUI();
  });
  size.addEventListener('input', updateUI);
  heightPos.addEventListener('input', updateUI);
  sensitivity.addEventListener('input', updateUI);

  autoBtn.addEventListener('click', () => {
    autoMode = !autoMode;
    status.textContent = autoMode
      ? '自動検出ON。景色の横方向の流れに合わせます。'
      : '自動検出OFF。走る速さ・向きは手動です。';
    updateUI();
  });

  flipBtn.addEventListener('click', () => {
    flipped = !flipped;
    autoMode = false;
    updateUI();
    status.textContent = '手動反転しました。自動検出はOFFです。';
  });

  jumpTestBtn.addEventListener('click', () => {
    startJump('manual');
  });

  startCam.addEventListener('click', startCamera);

  // Re-read current speed every frame, so auto speed changes take effect without restarting timer.
  function animationLoop() {
    const now = performance.now();

    if (isJumping) {
      updateJump(now);
      // ジャンプ中は6コマ側が画像を管理する。
      setTimeout(animationLoop, 24);
      return;
    }

    ninja.src = FRAMES[frameIndex];
    frameIndex = (frameIndex + 1) % FRAMES.length;
    setTimeout(animationLoop, Number(speed.value));
  }

  updateUI();
  if (window.top === window.self) {
    status.textContent = '単独HTMLで起動しています。「カメラ開始」を押してください。';
  } else {
    status.textContent = 'このページはiframe内です。カメラが拒否される場合があります。';
  }
  animationLoop();
})();
</script>
</body>
</html>
